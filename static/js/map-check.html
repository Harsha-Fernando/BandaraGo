<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BandaraGo map checks</title>
  <link rel="stylesheet" href="../css/bootstrap/bootstrap.min.css">
</head>
<body>
<main class="container py-4">
  <h1 class="h3">BandaraGo browser map checks</h1>
  <p>Runs the actual map.js with a simulated Leaflet API. No map tiles are requested.</p>
  <p id="summary" role="status">Running…</p>
  <ol id="results"></ol>
</main>
<script src="bootstrap/bootstrap.bundle.min.js"></script>
<script>
// Each frame gives the unmodified map script a fresh DOM and simulated Leaflet.
function installLeafletStub() {
  const state = window.checkState = {markers: [], events: {}};
  const map = {
    setView(point, zoom) { state.view = {point, zoom}; },
    fitBounds(points) { state.bounds = points; },
  };
  const tiles = {
    on(name, callback) { state.events[name] = callback; return this; },
    addTo() {},
  };
  window.L = {
    map() { return map; },
    tileLayer(url, options) { state.tileUrl = url; state.tileOptions = options; return tiles; },
    marker(point, options) {
      const marker = {point, options, addTo() { return this; }, bindPopup(label) { this.label = label; return this; }};
      state.markers.push(marker);
      return marker;
    },
  };
}
function assert(condition, message) {
  if (!condition) throw new Error(message);
}
function runFrame(data, callback, withLeaflet = true) {
  return new Promise((resolve, reject) => {
    const frame = document.createElement('iframe');
    frame.hidden = true;
    frame.onload = () => {
      try { callback(frame.contentWindow, frame.contentDocument); resolve(); }
      catch (error) { reject(error); }
      finally { frame.remove(); }
    };
    const safeData = data.replace(/</g, '\\u003c');
    frame.srcdoc = '<div id="map"></div><p id="map-status"></p>' +
      '<script type="application/json" id="map-data">' + safeData + '<\/script>' +
      (withLeaflet ? '<script>(' + installLeafletStub.toString() + ')();<\/script>' : '') +
      '<script src="map.js"><\/script>';
    document.body.append(frame);
  });
}
const point = {name: '<img src=x onerror=alert(1)>', latitude: 6.6, longitude: 79.9};
const sample = JSON.stringify([point]);
const cases = [
  ['Local Bootstrap JavaScript loads', () => {
    assert(window.bootstrap && bootstrap.Tooltip.VERSION === '5.3.8', 'Matching Bootstrap bundle did not load');
  }],
  ['Single marker uses coordinates, safe text, and OSM referrer policy', () => runFrame(sample, (win, doc) => {
    const state = win.checkState;
    assert(state.markers.length === 1, 'Expected one marker');
    assert(state.markers[0].point[0] === point.latitude && state.markers[0].point[1] === point.longitude, 'Wrong marker coordinates');
    assert(state.markers[0].label.textContent === point.name && !state.markers[0].label.querySelector('img'), 'Unsafe popup label');
    assert(state.view.zoom === 15, 'Incorrect single-marker zoom');
    assert(state.tileOptions.referrerPolicy === 'strict-origin-when-cross-origin', 'Missing OSM referrer policy');
    assert(doc.getElementById('map').dataset.markersReady === 'true', 'Marker readiness not recorded');
  })],
  ['Multiple markers use bounds', () => runFrame(JSON.stringify([point, {...point, latitude: 6.7}]), win => {
    assert(win.checkState.bounds.length === 2, 'Bounds do not contain both points');
  })],
  ['Tile failures remain visible after load event', () => runFrame(sample, (win, doc) => {
    win.checkState.events.tileerror();
    win.checkState.events.load();
    assert(doc.getElementById('map-status').textContent.includes('could not load'), 'Tile failure was hidden');
  })],
  ['Successful tile load gives interaction help', () => runFrame(sample, (win, doc) => {
    win.checkState.events.load();
    assert(doc.getElementById('map-status').textContent.includes('zoom'), 'Expected zoom/pan help');
  })],
  ['Malformed data has a fallback', () => runFrame('invalid', (win, doc) => {
    assert(doc.getElementById('map-status').textContent.includes('unavailable'), 'Missing malformed-data fallback');
  })],
  ['Empty data has a fallback', () => runFrame('[]', (win, doc) => {
    assert(doc.getElementById('map-status').textContent.includes('unavailable'), 'Missing empty-data fallback');
  })],
  ['Missing Leaflet has a fallback', () => runFrame(sample, (win, doc) => {
    assert(doc.getElementById('map-status').textContent.includes('unavailable'), 'Missing Leaflet fallback');
  }, false)],
];
(async () => {
  let passed = 0;
  for (const [name, check] of cases) {
    const row = document.createElement('li');
    try { await check(); passed++; row.textContent = 'PASS: ' + name; }
    catch (error) { row.textContent = 'FAIL: ' + name + ': ' + error.message; }
    document.getElementById('results').append(row);
  }
  document.getElementById('summary').textContent = passed + '/' + cases.length + ' checks passed';
})();
</script>
</body>
</html>
